# Chạy toàn bộ test (Node, mock Apps Script - không cần cài gói) mỗi lần đẩy code / mở PR.
name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kiểm tra cú pháp mã máy chủ
        run: node --check --input-type=commonjs < Code.gs
      - name: Chạy test
        run: node --test "tests/**/*.test.mjs"
